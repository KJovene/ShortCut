memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
date.timezone = Europe/Paris

; Développement : les fichiers montés depuis l'hôte changent sans redémarrage.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Couverture de tests : pcov est installé mais inactif, `make coverage` l'active pour la mesure seulement.
pcov.enabled = 0
pcov.directory = /app/src
