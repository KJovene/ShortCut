# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    http_client:
        scoped_clients:
            # API Claude, injecté par « HttpClientInterface $claudeClient ». La clé reste côté serveur :
            # le site ne parle qu'à /api/chat, jamais à api.anthropic.com.
            claude.client:
                base_uri: 'https://api.anthropic.com'
                headers:
                    x-api-key: '%env(ANTHROPIC_API_KEY)%'
                    anthropic-version: '2023-06-01'
                # Délai maximal sans recevoir de données du flux.
                timeout: 60

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Aucun appel réseau en test : les réponses de l'API Claude sont simulées.
        http_client:
            mock_response_factory: App\Tests\Chatbot\FausseApiClaude
