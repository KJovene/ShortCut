          in: query
          description: 'Durée en minutes, ex. dureeMinutes[lte]=180.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'dureeMinutes[ne]'
          in: query
          description: 'Durée en minutes, ex. dureeMinutes[lte]=180.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'dureeMinutes[between]'
          in: query
          description: 'Durée en minutes, ex. dureeMinutes[lte]=180.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
    post:
      operationId: api_activites_post
