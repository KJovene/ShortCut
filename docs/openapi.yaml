components:
  schemas:
    Activite-prestation.ecriture:
      type: object
      description: |-
        Logement ou activité proposé par un prestataire dans une destination.
        Exposée sous deux adresses, /api/logements et /api/activites (voir TypePrestationExtension).
        Groupe `prestation:public` : ce que le site peut montrer ; `prestation:interne` : prestataire et tarifs d'achat.
        Groupe `public:read` : exemples d'une destination sur le site public (sans destination, prestataire ni tarifs).
      required:
        - nom
        - destination
        - prestataire
      properties:
        nom:
          maxLength: 150
          type: string
        destination:
          type: string
          format: iri-reference
          example: 'https://example.com/'
        prestataire:
          type: string
          format: iri-reference
          example: 'https://example.com/'
        categorie:
          maxLength: 100
          description: 'Ex. « 3 étoiles », « villa », « excursion ».'
          type:
            - string
            - 'null'
        description:
          maxLength: 5000
          type:
            - string
            - 'null'
        capacite:
          minimum: 0
          exclusiveMinimum: 0
          maximum: 1000
          description: 'Nombre maximum de personnes.'
          default: 1
          type: integer
        chambres:
          minimum: 0
          exclusiveMinimum: 0
          maximum: 500
          description: "Nombre de chambres d'un logement (un riad entier : 6 ; une chambre double : 1)."
          type:
            - integer
            - 'null'
        equipements:
          type: array
          items:
            type: string
        accessible:
          description: 'Adapté aux personnes à mobilité réduite.'
          default: false
          type: boolean
        dureeMinutes:
          minimum: 0
          exclusiveMinimum: 0
          description: "Durée d'une activité."
          type:
            - integer
            - 'null'
        ageMinimum:
          minimum: 0
          maximum: 99
          type:
            - integer
            - 'null'
        envies:
          type: array
          items:
            type: string
        photos:
          maxItems: 10
          type: array
          items:
            type: string
