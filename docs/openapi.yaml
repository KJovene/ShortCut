openapi: 3.2.0
info:
  title: 'ShortCut API'
  description: |-
    API de l'agence ShortCut. Le catalogue (destinations, prestataires, logements, activités, tarifs)
    est réservé aux conseillers connectés : la session ouverte par /api/connexion sert ici aussi.
    Le site public lit, sans connexion, les destinations publiées (/api/public/destinations), leur climat
    et des exemples avec un prix « à partir de », ainsi que les pages du site (/api/pages/{slug}).
  version: 1.0.0
servers:
  -
    url: /
    description: ''
paths:
  /api/activites:
    get:
      operationId: api_activites_get_collection
      tags:
        - Activite
      responses:
        '200':
          description: 'Activite collection'
          content:
            application/ld+json:
              schema:
                type: object
                description: 'Activite.jsonld-prestation.public_prestation.interne_prestation.tarifs collection.'
                allOf:
                  - { $ref: '#/components/schemas/HydraCollectionBaseSchema' }
                  - { type: object, required: [member], properties: { member: { type: array, items: { $ref: '#/components/schemas/Activite.jsonld-prestation.public_prestation.interne_prestation.tarifs' } } } }
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activite-prestation.public_prestation.interne_prestation.tarifs'
        '403':
          description: Forbidden
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Error.jsonld'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Retrieves the collection of Activite resources.'
      description: 'Retrieves the collection of Activite resources.'
      parameters:
        -
          name: page
          in: query
          description: 'The collection page number'
          required: false
          deprecated: false
          schema:
            type: integer
            default: 1
          style: form
          explode: true
        -
          name: destination
          in: query
          description: 'Activite destination'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: destinationSlug
          in: query
          description: 'Slug de la destination, ex. lisbonne.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: prestataire
          in: query
          description: 'Activite prestataire'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: categorie
          in: query
          description: 'Activite categorie'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: 'capacite[gt]'
          in: query
          description: 'Capacité, ex. capacite[gte]=4 pour au moins 4 personnes.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'capacite[gte]'
          in: query
          description: 'Capacité, ex. capacite[gte]=4 pour au moins 4 personnes.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'capacite[lt]'
          in: query
          description: 'Capacité, ex. capacite[gte]=4 pour au moins 4 personnes.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'capacite[lte]'
          in: query
          description: 'Capacité, ex. capacite[gte]=4 pour au moins 4 personnes.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'capacite[ne]'
          in: query
          description: 'Capacité, ex. capacite[gte]=4 pour au moins 4 personnes.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'capacite[between]'
          in: query
          description: 'Capacité, ex. capacite[gte]=4 pour au moins 4 personnes.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: accessible
          in: query
          description: 'Adapté aux personnes à mobilité réduite.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: envie
          in: query
          description: 'Envie associée (plage, culture, détente…).'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: mois
          in: query
          description: 'Disponible ce mois-ci (AAAA-MM) : au moins un tarif saisi sur le mois.'
          required: false
          deprecated: false
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: 2027-05
          style: form
          explode: true
        -
          name: 'ageMinimum[gt]'
          in: query
          description: 'Âge minimum, ex. ageMinimum[lte]=8 pour une activité ouverte à un enfant de 8 ans.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'ageMinimum[gte]'
          in: query
          description: 'Âge minimum, ex. ageMinimum[lte]=8 pour une activité ouverte à un enfant de 8 ans.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'ageMinimum[lt]'
          in: query
          description: 'Âge minimum, ex. ageMinimum[lte]=8 pour une activité ouverte à un enfant de 8 ans.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'ageMinimum[lte]'
          in: query
          description: 'Âge minimum, ex. ageMinimum[lte]=8 pour une activité ouverte à un enfant de 8 ans.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'ageMinimum[ne]'
          in: query
          description: 'Âge minimum, ex. ageMinimum[lte]=8 pour une activité ouverte à un enfant de 8 ans.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'ageMinimum[between]'
          in: query
          description: 'Âge minimum, ex. ageMinimum[lte]=8 pour une activité ouverte à un enfant de 8 ans.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'dureeMinutes[gt]'
          in: query
          description: 'Durée en minutes, ex. dureeMinutes[lte]=180.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'dureeMinutes[gte]'
          in: query
          description: 'Durée en minutes, ex. dureeMinutes[lte]=180.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'dureeMinutes[lt]'
          in: query
          description: 'Durée en minutes, ex. dureeMinutes[lte]=180.'
          required: false
          deprecated: false
