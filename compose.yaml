name: shortcut

services:
  php:
    build: docker/php
    # Même uid/gid que l'utilisateur hôte : les fichiers créés (cache, migrations…) lui appartiennent.
    user: '${UID:-1000}:${GID:-1000}'
    volumes:
      - ./api:/app
    environment:
      # Les variables réelles priment sur api/.env : dans Docker, la base s'appelle « database ».
      DATABASE_URL: postgresql://shortcut:shortcut@database:5432/shortcut?serverVersion=16&charset=utf8
      # ANTHROPIC_API_KEY est lue dans api/.env.local : elle reste côté API, jamais dans le site.
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '${API_PORT:-8000}:80'
    volumes:
      - ./api/public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # Site React (Vite) : http://localhost:5173. Les appels /api et /uploads sont proxifiés vers nginx.
  front:
    build: docker/node
    user: '${UID:-1000}:${GID:-1000}'
    # npm ci au démarrage, seulement si package-lock.json a changé depuis la dernière installation.
    command: sh -c "[ node_modules/.package-lock.json -nt package-lock.json ] || npm ci --no-audit --no-fund; npm run dev -- --host 0.0.0.0"
    ports:
      - '${FRONT_PORT:-5173}:5173'
    volumes:
      - ./site:/app
      # node_modules reste dans un volume : binaires Linux, sans conflit avec ceux de la machine.
      - front_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://nginx
      # Les événements de fichiers ne traversent pas toujours le partage Docker (Windows, macOS) : scrutation.
      VITE_POLLING: 'true'
    depends_on:
      - nginx

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortcut
      POSTGRES_USER: shortcut
      POSTGRES_PASSWORD: shortcut
    ports:
      # 5433 côté hôte pour ne pas entrer en conflit avec un PostgreSQL installé localement.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'shortcut', '-d', 'shortcut']
      interval: 5s
      timeout: 5s
      retries: 10

  # Interface web pour parcourir la base : http://localhost:8080 (serveur « database », shortcut / shortcut).
  adminer:
    image: adminer:5
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: database
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - database

volumes:
  database_data:
  front_node_modules:
